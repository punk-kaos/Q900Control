name: SDR DMR self-test

on:
  push:
    branches: ["main", "feature/sdr-dmr"]
  pull_request:
    paths:
      - "dmr.py"
      - "q900_control.py"
      - ".github/workflows/dmr-selftest.yml"
      - "tools/build_opendmr_fixed.sh"

jobs:
  dmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1
      - run: python -m pip install numpy PyQt6 pyserial sounddevice websocket-client
      - run: python -m py_compile dmr.py q900_control.py
      - run: python dmr.py
      - name: Build fixed OpenDMR and smoke-test real TX ABI
        run: |
          bash tools/build_opendmr_fixed.sh
          python - <<'PY'
          import numpy as np
          import dmr
          codec = dmr.OpenDmrCodec(enc=True, dec=True)
          assert "q900fix" in str(codec.lib._name), codec.lib._name
          assert codec.version == dmr.OPENDMR_TX_VERSION, codec.version
          # The public encoder now returns documented DVSI A+B+C order directly.
          # Exhaust all 4096 A payloads with C1=0: canonical B must then be the
          # independently calculated 23-bit DMR whitening mask.
          for seed in range(4096):
              params = (
                  ((seed >> 8) & 0xF) << 3,
                  ((seed >> 4) & 0xF) << 1,
                  (seed & 0xF) << 1,
                  0, 0, 0, 0, 0, 0,
              )
              encoded = dmr.bytes_bits(codec._encode_params_frame(params))
              actual = 0
              for bit in encoded[24:47]:
                  actual = (actual << 1) | int(bit)
              assert actual == dmr.dmr_prng_mask(seed), (seed, actual)
          frame = codec.encode(np.zeros(160, dtype=np.int16))
          assert len(frame) == 9
          canonical = dmr.bytes_bits(frame)
          assert dmr._ota_to_can(dmr._can_to_ota(frame)) == frame
          pcm, errors = codec.decode(frame)
          assert len(pcm) == 160
          print("OpenDMR fixed TX bridge:", codec.lib._name, frame.hex(), "decode errors", errors)
          codec.close()

          cfg = dmr.DmrConfig(1234567, 91, 1, 1, True, False)
          tx = dmr.DmrVoiceTransmitter(
              cfg, codec=dmr.OpenDmrCodec(enc=True),
              diagnostic_prefix="/tmp/q900-dmr-vocoder", preamble_ms=0,
          )
          t = np.arange(960 * 3, dtype=np.float64) / dmr.SAMPLE_RATE
          voiced = (
              0.30 * np.sin(2 * np.pi * 137 * t)
              + 0.18 * np.sin(2 * np.pi * 274 * t)
              + 0.10 * np.sin(2 * np.pi * 411 * t)
              + 0.06 * np.sin(2 * np.pi * 685 * t)
          )
          voiced *= 0.75 + 0.25 * np.sin(2 * np.pi * 7 * t)
          tx.feed_pcm(voiced.astype(np.float32))
          tx.close()
          import json, wave
          with open("/tmp/q900-dmr-vocoder.dmr.vocoder.json") as h:
              meta = json.load(h)
          assert meta["frames"] == 3
          assert meta["decode_failures"] == 0
          assert meta["decode_errors"] == 0
          with wave.open("/tmp/q900-dmr-vocoder.dmr.mic.wav", "rb") as w:
              assert w.getframerate() == 8000 and w.getnframes() == 480
              mic = np.frombuffer(w.readframes(w.getnframes()), dtype="<i2").astype(np.float64)
          with wave.open("/tmp/q900-dmr-vocoder.dmr.roundtrip.wav", "rb") as w:
              assert w.getframerate() == 8000 and w.getnframes() == 480
              roundtrip = np.frombuffer(w.readframes(w.getnframes()), dtype="<i2").astype(np.float64)
          mic_rms = float(np.sqrt(np.mean(mic * mic)))
          round_rms = float(np.sqrt(np.mean(roundtrip * roundtrip)))
          assert mic_rms > 1000.0, mic_rms
          assert round_rms > 100.0, round_rms
          assert np.max(np.abs(roundtrip)) > 500.0
          assert len(open("/tmp/q900-dmr-vocoder.dmr.ambe.raw", "rb").read()) == 27

          import q900_control
          sweep = q900_control.generate_dmr_vocoder_gain_sweep("/tmp/q900-dmr-vocoder")
          assert [row[0] for row in sweep] == [0.0, 6.0, 12.0, 18.0]
          for gain_db, path, clipped, errors, failures in sweep:
              assert errors == 0 and failures == 0
              with wave.open(path, "rb") as w:
                  assert w.getframerate() == 8000 and w.getnframes() == 480

          internal = q900_control.generate_dmr_vocoder_internal_gain_sweep("/tmp/q900-dmr-vocoder")
          assert [row[0] for row in internal] == [6.0, 8.0, 10.0, 12.0, 14.0, 16.0, 18.0]
          for attenuation_db, path, matched, rms_dbfs, peak_dbfs, errors, failures in internal:
              assert errors == 0 and failures == 0
              assert rms_dbfs <= 0.0 and peak_dbfs <= 0.0
              for wav_path in (path, matched):
                  with wave.open(wav_path, "rb") as w:
                      assert w.getframerate() == 8000 and w.getnframes() == 480
          PY
      - run: QT_QPA_PLATFORM=offscreen python q900_control.py --self-test
