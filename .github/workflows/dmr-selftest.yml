name: SDR DMR self-test

on:
  push:
    branches: ["feature/sdr-dmr"]
  pull_request:
    paths:
      - "dmr.py"
      - "q900_control.py"
      - ".github/workflows/dmr-selftest.yml"

jobs:
  dmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install numpy PyQt6 pyserial sounddevice websocket-client
      - run: python -m py_compile dmr.py q900_control.py
      - run: python dmr.py
      - run: QT_QPA_PLATFORM=offscreen python q900_control.py --self-test
