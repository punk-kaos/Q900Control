name: SDR DMR self-test

on:
  push:
    branches: ["feature/sdr-dmr"]
  pull_request:
    paths:
      - "dmr.py"
      - "q900_control.py"
      - ".github/workflows/dmr-selftest.yml"

jobs:
  dmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1
      - run: python -m pip install numpy PyQt6 pyserial sounddevice websocket-client
      - run: python -m py_compile dmr.py q900_control.py
      - run: python dmr.py
      - name: Build OpenDMR and smoke-test real TX ABI
        run: |
          git clone --depth=1 https://github.com/MW0MWZ/OpenDMR.git /tmp/OpenDMR
          make -C /tmp/OpenDMR -j2 libopendmr.so
          Q900_OPENDMR_LIB=/tmp/OpenDMR/libopendmr.so python - <<'PY'
          import numpy as np
          import dmr
          codec = dmr.OpenDmrCodec(enc=True, dec=True)
          frame = codec.encode(np.zeros(160, dtype=np.int16))
          assert len(frame) == 9
          pcm, errors = codec.decode(frame)
          assert len(pcm) == 160
          print("OpenDMR native TX bridge:", frame.hex(), "decode errors", errors)
          codec.close()
          PY
      - run: QT_QPA_PLATFORM=offscreen python q900_control.py --self-test
